<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Share your feedback with Kalahari Café. We value your opinion and would love to hear from you!" />
  <link rel="icon" href="images/logo.png" type="image/png" />
  <title>Feedback | Kalahari Café</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="nav-logo">
        <img src="images/logo.png" alt="Kalahari Café Logo" class="logo">
        <h2 class="logo-text">Kalahari Café</h2>
      </a>

      <ul class="nav-menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
        <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
        <li class="nav-item nav-dropdown">
          <a href="menu.html" class="nav-link dropdown-toggle">Menu</a>
          <ul class="dropdown-menu">
            <li><a href="menu.html" class="dropdown-link">Menu Items</a></li>
            <li><a href="gallery.html" class="dropdown-link">Gallery</a></li>
          </ul>
        </li>
        <li class="nav-item"><a href="feedback.html" class="nav-link active">Feedback</a></li>
        <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
        <li class="nav-item"><a href="order.html" class="order-btn">Order Now</a></li>
      </ul>

      <button id="menu-open-button" class="fas fa-bars"></button>
    </nav>
  </header>

  <!-- Feedback Section -->
  <section class="feedback-section">
    <div class="section-content">
      <h2 class="section-title">Customer Feedback</h2>
      <p class="section-subtitle">We'd love to hear from you! Please share your feedback below.</p>

      <form class="feedback-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="rating">Rate Us</label>
          <select id="rating" required>
            <option value="">Select Rating</option>
            <option>⭐⭐⭐⭐⭐ Excellent</option>
            <option>⭐⭐⭐⭐ Very Good</option>
            <option>⭐⭐⭐ Good</option>
            <option>⭐⭐ Fair</option>
            <option>⭐ Poor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Your Feedback</label>
          <textarea id="message" rows="5" placeholder="Write your feedback..." required></textarea>
        </div>

        <button type="submit" class="btn btn-submit">Submit Feedback</button>
      </form>
    </div>
  </section>

  <script src="script.js"></script>

</body>
</html>
